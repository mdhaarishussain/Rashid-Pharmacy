<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Consultation cockpit for homeopathic practitioners" />
    <title>Clinic Memory OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <script>
      /* Apply the saved text size before first paint (keep in sync with src/services/textSize.ts). */
      try {
        var s = localStorage.getItem('clinic_os_text_size')
        var p = { 'A': '100%', 'A+': '112.5%', 'A++': '125%' }
        if (s && p[s]) document.documentElement.style.fontSize = p[s]
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
